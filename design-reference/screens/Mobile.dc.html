<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Soul Ledger — Live matches (mobile)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F0D0B}
a{color:#EFE6D4;text-decoration:none}a:hover{color:#FFFFFF}
.grain{background-image:radial-gradient(rgba(239,230,212,0.05) 1px,transparent 1px);background-size:3px 3px}
</style>
</helmet>
<div class="grain" style="width: 390px; height: 844px; box-sizing: border-box; background-color: #0F0D0B; color: #EFE6D4; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

<div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 10px; border-bottom: 3px double #3A3227">
<a href="Main.dc.html" style="display: flex; align-items: baseline; gap: 6px"><span style="font-family: 'Instrument Serif', serif; font-style: italic; font-size: 24px; line-height: 1; color: {{accent}}">Soul</span><span style="font-family: 'Instrument Serif', serif; font-size: 24px; line-height: 1">Ledger</span></a>
<button type="button" aria-label="Search players" style="width: 44px; height: 44px; border: 1px solid #3A3227; background: #17140F; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="5.5" stroke="#EFE6D4" stroke-width="1.5"></circle><path d="M12.2 12.2L16 16" stroke="#EFE6D4" stroke-width="1.5" stroke-linecap="round"></path></svg></button>
</div>

<div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 14px; padding: 18px 16px 12px; overflow: hidden">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<h1 style="margin: 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 44px; line-height: 1">Live <span style="font-style: italic; color: {{accent}}">now</span></h1>
<span style="font-family: 'Geist Mono', monospace; font-size: 11px; color: #9C9180">1,284 IN PROGRESS</span>
</div>
<div role="group" aria-label="Filter" style="display: flex; gap: 6px">
<button type="button" style="height: 44px; padding: 0 14px; border: 1px solid {{accent}}; background: {{accent}}; color: #0F0D0B; font: 500 13px 'Geist', sans-serif">Top ranked</button>
<button type="button" style="height: 44px; padding: 0 14px; border: 1px solid #3A3227; background: transparent; color: #9C9180; font: 500 13px 'Geist', sans-serif">All</button>
<button type="button" style="height: 44px; padding: 0 14px; border: 1px solid #3A3227; background: transparent; color: #9C9180; font: 500 13px 'Geist', sans-serif">Friends</button>
</div>

<a href="MatchMobile.dc.html" style="border: 1px solid #3A3227; background: #17140F; padding: 14px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.06em; color: #9C9180"><span>ETERNUS · RANKED</span><span style="display: flex; align-items: center; gap: 6px; color: {{accent}}"><span style="width: 6px; height: 6px; border-radius: 50%; background: {{accent}}"></span>22:41</span></div>
<div style="display: flex; justify-content: space-between; align-items: flex-end">
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #F0912E">Hidden King</span><span style="font-family: 'Instrument Serif', serif; font-size: 32px; line-height: 1">96.2k</span></div>
<div style="display: flex; flex-direction: column; gap: 2px; align-items: center"><span style="font-family: 'Geist Mono', monospace; font-size: 11px; color: #9C9180">LEAD</span><span style="font-family: 'Geist Mono', monospace; font-size: 15px; color: #F0912E">+7.5k</span></div>
<div style="display: flex; flex-direction: column; gap: 2px; text-align: right"><span style="font-size: 12px; color: #8FA9FF">Archmother</span><span style="font-family: 'Instrument Serif', serif; font-size: 32px; line-height: 1">88.7k</span></div>
</div>
<div style="display: flex; height: 8px; gap: 3px"><div style="flex: 96.2; background: #F0912E"></div><div style="flex: 88.7; background: #5E8BFF"></div></div>
<div style="display: flex; justify-content: space-between">
<div style="display: flex; gap: 3px"><sc-for list="{{amber}}" as="h" hint-placeholder-count="6"><span aria-hidden="true" style="width: 24px; height: 24px; border: 1px solid #F0912E; display: flex; align-items: center; justify-content: center; font-family: 'Instrument Serif', serif; font-size: 12px; background: #1F1B15">{{h}}</span></sc-for></div>
<div style="display: flex; gap: 3px"><sc-for list="{{sapph}}" as="h" hint-placeholder-count="6"><span aria-hidden="true" style="width: 24px; height: 24px; border: 1px solid #5E8BFF; display: flex; align-items: center; justify-content: center; font-family: 'Instrument Serif', serif; font-size: 12px; background: #1F1B15">{{h}}</span></sc-for></div>
</div>
<div style="font-family: 'Geist Mono', monospace; font-size: 11px; color: #9C9180">412 spectators · 2 Walkers down each</div>
</a>

<div style="display: flex; flex-direction: column">
<sc-for list="{{others}}" as="m" hint-placeholder-count="4">
<a href="MatchMobile.dc.html" style="display: grid; grid-template-columns: minmax(0, 1fr) 96px; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid #231E18">
<div style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 14px">{{m.rank}} <span style="font-family: 'Geist Mono', monospace; font-size: 11px; color: #9C9180">· {{m.time}}</span></span><span style="font-family: 'Geist Mono', monospace; font-size: 11px; color: {{m.lc}}">{{m.lead}}</span></div>
<div style="display: flex; height: 6px; gap: 2px"><div style="flex: {{m.a}}; background: #F0912E"></div><div style="flex: {{m.s}}; background: #5E8BFF"></div></div>
</a>
</sc-for>
</div>
</div>

<nav aria-label="Primary" style="display: flex; border-top: 1px solid #2C261E; background: #0C0A08; padding: 6px 8px 18px">
<a href="MetaMobile.dc.html" style="flex: 1 1 0; min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: #9C9180"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4 16V9M8 16V4M12 16V7M16 16V11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path></svg>Meta</a>
<a href="Mobile.dc.html" style="flex: 1 1 0; min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: {{accent}}"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="3" fill="currentColor"></circle><circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.5"></circle></svg>Live</a>
<a href="PlayerMobile.dc.html" style="flex: 1 1 0; min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: #9C9180"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="7" r="3" stroke="currentColor" stroke-width="1.5"></circle><path d="M4 16c1.2-3 3.4-4.5 6-4.5s4.8 1.5 6 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path></svg>Players</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D9B26F","options":["#D9B26F","#E58B3A","#EFE6D4","#8FA9FF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#D9B26F';
    const amber = ['Wa', 'Ha', 'Pa', 'Be', 'Mi', 'LG'];
    const sapph = ['Se', 'In', 'Ab', 'Vi', 'Iv', 'Mc'];
    const others = [
      ['Ascendant', '31:08', 54.1, 49.3],
      ['Ascendant', '18:52', 41.0, 44.6],
      ['Phantom', '27:30', 70.4, 62.2],
      ['Phantom', '12:15', 26.3, 26.9]
    ].map(([rank, time, a, s]) => {
      const d = a - s;
      return { rank, time, a, s, lead: (d >= 0 ? 'Hidden King +' : 'Archmother +') + Math.abs(d).toFixed(1) + 'k souls', lc: d >= 0 ? '#F0912E' : '#8FA9FF' };
    });
    return { accent, amber, sapph, others };
  }
}
</script>
</body>
</html>
